<!DOCTYPE html>
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui">

    <aside class="sidebar">

        <div class="sidebar-header">
            <h3>🏫 Admission Panel</h3>
        </div>

        <h:form>
            <div class="sidebar">

                
                <!-- Dashboard -->
                <h:link outcome="/Admission/dashboard.xhtml" value="📊 Dashboard" />

                <!-- Admission -->
                <h:link outcome="/Admission/student-registration.xhtml" value="📝 Student Registration" />
                <h:link outcome="/Admission/enrollment-admission.xhtml" value="📋 Admission Enrollment" />
                <h:link outcome="/Admission/student-list.xhtml" value="📜 Student List" />

                <!-- Students 
                <h:link outcome="/Registrar/student-list.xhtml" value="👨‍🎓 Student List" />-->

                <!-- Profile -->
                <ui:include src="/common/user-profile-dialog.xhtml"/>

                <p:commandLink value="👤 Profile"
                               onclick="PF('userProfileDialog').show(); return false;" />
                
                <a href="#{request.contextPath}/logout"
                   onclick="return confirm('Are you sure you want to logout?');">
                    🚪 Logout
                </a>
            </div>
        </h:form>


    </aside>

</ui:composition>
