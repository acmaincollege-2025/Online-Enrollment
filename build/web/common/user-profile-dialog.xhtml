<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog header="👤 User Profile"
              widgetVar="userProfileDialog"
              modal="true"
              closable="true"
              resizable="false"
              draggable="false"
              width="520"
              appendTo="@(body)">

        <h:form id="profileForm">

            <p:messages id="msgs" showDetail="true" closable="true"/>

            <!-- =======================
                 UPDATE PROFILE PANEL
                 ======================= -->
            <p:panel header="📝 Update Profile" styleClass="ui-fluid">

                <h:panelGrid columns="2" cellpadding="6" columnClasses="label,value">

                    <h:outputLabel for="username" value="Username" />
                    <p:inputText id="username"
                                 value="#{userProfileBean.currentUser.username}"
                                 required="true"/>

                    <h:outputLabel for="firstname" value="First Name" />
                    <p:inputText id="firstname"
                                 value="#{userProfileBean.currentUser.firstname}" />

                    <h:outputLabel for="lastname" value="Last Name" />
                    <p:inputText id="lastname"
                                 value="#{userProfileBean.currentUser.lastname}" />

                </h:panelGrid>

                <p:spacer height="10"/>

                <p:commandButton value="Save Changes"
                                 icon="pi pi-save"
                                 action="#{userProfileBean.updateProfile}"
                                 update="profileForm"
                                 styleClass="ui-button-success ui-button-sm"/>
            </p:panel>

            <p:spacer height="15"/>

            <!-- =======================
                 CHANGE PASSWORD PANEL
                 ======================= -->
            <p:panel header="🔐 Change Password" styleClass="ui-fluid">

                <h:panelGrid columns="2" cellpadding="6" columnClasses="label,value">

                    <h:outputLabel for="currentPwd" value="Current Password" />
                    <p:password id="currentPwd"
                                value="#{userProfileBean.currentPassword}"
                                feedback="false"
                                required="true"/>

                    <h:outputLabel for="newPwd" value="New Password" />
                    <p:password id="newPwd"
                                value="#{userProfileBean.newPassword}"
                                feedback="true"
                                required="true"/>

                    <h:outputLabel for="confirmPwd" value="Confirm Password" />
                    <p:password id="confirmPwd"
                                value="#{userProfileBean.confirmPassword}"
                                feedback="false"
                                required="true"/>

                </h:panelGrid>

                <p:spacer height="10"/>

                <p:commandButton value="Update Password"
                                 icon="pi pi-key"
                                 action="#{userProfileBean.changePassword}"
                                 update="profileForm"
                                 styleClass="ui-button-secondary ui-button-sm"/>
            </p:panel>

        </h:form>
    </p:dialog>

</ui:composition>
