<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Enrollment Confirmation</title>
    </h:head>
    <style>
        .status-pending {
            background:#fff3cd;
            color:#856404;
            padding:4px 10px;
            border-radius:12px;
            font-weight:bold;
        }

        .status-approved {
            background:#d4edda;
            color:#155724;
            padding:4px 10px;
            border-radius:12px;
            font-weight:bold;
        }

        .status-cancelled {
            background:#f8d7da;
            color:#721c24;
            padding:4px 10px;
            border-radius:12px;
            font-weight:bold;
        }
    </style>

    <h:body>

        <ui:composition template="/template/layout-admission.xhtml">

            <ui:define name="content">

                <h:form id="confirmForm">

                    <!-- PAGE HEADER -->
                    <p:panel styleClass="ui-panel ui-widget ui-widget-content ui-corner-all"
                             style="margin-bottom:15px">
                        <h2 style="margin:0">📌 Enrollment Confirmation</h2>
                        <small>Review enrollment details before approval</small>
                    </p:panel>

                    <p:messages id="msgs" showDetail="true" closable="true"/>

                    <!-- ================= STUDENT & ENROLLMENT INFO ================= -->
                    <p:panel header="👤 Student and Enrollment Information"
                             style="margin-bottom:15px">

                        <h:panelGrid columns="4" cellpadding="6" width="100%"
                                     columnClasses="label,value,label,value">

                            <h:outputText value="Student No:"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.studno}" />

                            <h:outputText value="Student Name:"/>
                            <h:outputText
                                value="#{enrollmentBean.selectedEnrollment.student.lastname},
                                #{enrollmentBean.selectedEnrollment.student.firstname}" />

                            <h:outputText value="Program:"/>
                            <h:outputText
                                value="#{enrollmentBean.selectedEnrollment.student.program_enrolled}" />

                            <h:outputText value="Academic Year:"/>
                            <h:outputText
                                value="#{enrollmentBean.selectedEnrollment.academic_year}" />

                            <h:outputText value="Semester:"/>
                            <h:outputText
                                value="#{enrollmentBean.selectedEnrollment.semester}" />

                            <h:outputText value="Status:"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.status}"
                                          styleClass="#{enrollmentBean.selectedEnrollment.status eq 'Pending' ? 'status-pending' :
                                                        enrollmentBean.selectedEnrollment.status eq 'Enrolled' ? 'status-approved' :
                                                        'status-cancelled'}"/>

                        </h:panelGrid>
                    </p:panel>

                    <!-- ================= ENROLLED COURSES ================= -->
                    <p:panel header="📚 Enrolled Courses"
                             style="margin-bottom:15px">

                        <p:dataTable value="#{enrollmentBean.enrolledCourses}"
                                     var="c"
                                     rows="10"
                                     emptyMessage="No courses found">

                            <p:column headerText="Code">
                                <h:outputText value="#{c.courseCode}" />
                            </p:column>

                            <p:column headerText="Title">
                                <h:outputText value="#{c.courseTitle}" />
                            </p:column>

                            <p:column headerText="Units" style="width:80px;text-align:center">
                                <h:outputText value="#{c.units}" />
                            </p:column>

                        </p:dataTable>
                    </p:panel>

                    <!-- ================= ASSESSMENT ================= -->
                    <p:panel header="💰 Assessment Summary"
                             rendered="#{not empty enrollmentBean.selectedEnrollment.assessment}"
                             style="margin-bottom:15px">

                        <h:panelGrid columns="2" cellpadding="6" width="50%">

                            <h:outputText value="Tuition Fee:"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.assessment.basicFee}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                            <h:outputText value="Library Fee:"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.assessment.libraryFee}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                            <h:outputText value="Medical/Dental Fee:"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.assessment.medicalDentalFee}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                            <h:outputText value="Insurance:"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.assessment.insuranceFee}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                            <h:outputText value="Other Fees:"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.assessment.otherFees}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                            <h:outputText value="Total Amount:" style="font-weight:bold"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.assessment.totalAmount}"
                                          style="font-weight:bold">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                        </h:panelGrid>
                    </p:panel>

                    <!-- ================= PAYMENT ================= -->
                    <p:panel header="💳 Payment Information"
                             rendered="#{not empty enrollmentBean.selectedEnrollment.payment}"
                             style="margin-bottom:15px">

                        <h:panelGrid columns="2" cellpadding="6" width="50%">

                            <h:outputText value="Payment Ref No:"/>
                            <h:outputText
                                value="#{enrollmentBean.selectedEnrollment.payment.paymentReferenceNumber}" />

                            <h:outputText value="Amount Paid:"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.payment.amountPaid}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                            <h:outputText value="Payment Date:"/>
                            <h:outputText value="#{enrollmentBean.selectedEnrollment.payment.paymentDate}">
                                <f:convertDateTime pattern="MMM dd, yyyy"/>
                            </h:outputText>

                        </h:panelGrid>
                    </p:panel>

                    <!-- ================= ACTION BUTTONS ================= -->
                    <p:panel>

                        <p:commandButton value="✅ Approve Enrollment"
                                         styleClass="ui-button-success"
                                         actionListener="#{enrollmentBean.approveEnrollment(enrollmentBean.selectedEnrollment)}"
                                         update="@form msgs"
                                         rendered="#{enrollmentBean.selectedEnrollment.status eq 'Pending'}"/>

                        <p:commandButton value="❌ Cancel Enrollment"
                                         styleClass="ui-button-danger"
                                         actionListener="#{enrollmentBean.cancelEnrollment(enrollmentBean.selectedEnrollment)}"
                                         update="@form msgs"
                                         rendered="#{enrollmentBean.selectedEnrollment.status eq 'Pending'}"
                                         style="margin-left:10px"/>

                    </p:panel>

                </h:form>

            </ui:define>
        </ui:composition>

    </h:body>
</html>
