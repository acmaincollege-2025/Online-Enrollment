<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<!-- File: /WebContent/admission/admission.xhtml -->

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Student Admission</title>

        <style>
            body {
                font-family: 'Segoe UI', sans-serif;
                background-color: #f4f4f4;
                margin: 0;
            }

            .page-title {
                background: #800000;
                color: white;
                padding: 16px;
                font-size: 22px;
                text-align: center;
                font-weight: bold;
            }

            .container {
                max-width: 900px;
                margin: 30px auto;
            }

            .custom-panel {
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 3px 10px rgba(0,0,0,0.15);
                padding: 20px;
            }

            .grid-label {
                font-weight: bold;
                color: #800000;
            }
        </style>
    </h:head>

    <h:body>

        <div class="page-title">Student Admission</div>

        <div class="container">

            <h:form id="admissionForm" enctype="multipart/form-data">
                <p:growl id="growl" showDetail="true" life="5000"/>

                <p:panel header="Student Admission Form" styleClass="custom-panel">

                    <p:panelGrid columns="2" columnClasses="grid-label,value"
                                 styleClass="ui-panelgrid-blank" >

                        <!-- STUDENT NUMBER -->
                        <p:outputLabel value="Student No:" for="studno" />
                        <p:inputText id="studno" value="#{admissionBean.student.studno}" required="true"
                                     style="width:100%" />

                        <!-- SR CODE -->
                        <p:outputLabel value="SR Code:" for="srcode" />
                        <p:inputText id="srcode" value="#{admissionBean.student.srcode}" required="true"
                                     style="width:100%" />

                        <!-- LAST NAME -->
                        <p:outputLabel value="Last Name:" for="lname" />
                        <p:inputText id="lname" value="#{admissionBean.student.lastname}" style="width:100%" />

                        <!-- FIRST NAME -->
                        <p:outputLabel value="First Name:" for="fname" />
                        <p:inputText id="fname" value="#{admissionBean.student.firstname}" style="width:100%" />

                        <!-- MIDDLE NAME -->
                        <p:outputLabel value="Middle Name:" for="mname" />
                        <p:inputText id="mname" value="#{admissionBean.student.middlename}" style="width:100%" />

                        <!-- GENDER -->
                        <p:outputLabel value="Gender:" for="gender" />
                        <p:selectOneMenu id="gender" value="#{admissionBean.student.gender}" style="width:100%">
                            <f:selectItem itemLabel="Select Gender" itemValue="" />
                            <f:selectItem itemLabel="Male" itemValue="Male" />
                            <f:selectItem itemLabel="Female" itemValue="Female" />
                        </p:selectOneMenu>

                        <!-- DATE OF BIRTH -->
                        <p:outputLabel value="Date of Birth:" for="dob" />
                        <p:calendar id="dob" value="#{admissionBean.student.dob}"
                                    pattern="yyyy-MM-dd" navigator="true" style="width:100%" />

                        <!-- EMAIL -->
                        <p:outputLabel value="Email:" for="email" />
                        <p:inputText id="email" value="#{admissionBean.student.email}" style="width:100%" />

                        <!-- CONTACT NO -->
                        <p:outputLabel value="Contact No:" for="contact" />
                        <p:inputText id="contact" value="#{admissionBean.student.contactno}" style="width:100%" />

                        <!-- PROGRAM -->
                        <p:outputLabel value="Program:" for="program" />
                        <p:selectOneMenu id="program" value="#{admissionBean.student.programId}" style="width:100%">
                            <f:selectItem itemLabel="Select Program" itemValue="" />
                            <f:selectItems value="#{admissionBean.programList}"
                                           var="p" itemLabel="#{p.programName}" itemValue="#{p.programId}"/>
                        </p:selectOneMenu>

                        <!-- PHOTO -->
                        <p:outputLabel value="Student Photo:" for="photo" />
                        <p:fileUpload id="photo"
                                      value="#{admissionBean.photo}"
                                      mode="advanced"
                                      auto="true"
                                      update="growl"
                                      multiple="false" />
                    </p:panelGrid>

                    <br/>

                    <p:commandButton value="Save Student"
                                     action="#{admissionBean.saveStudent}"
                                     update="admissionForm growl"
                                     style="background:#800000; color:white; width:200px;"/>

                </p:panel>

            </h:form>

        </div>

    </h:body>
</html>
