<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition template="/template/registrar-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="content">

        <h:form id="programForm">

            <!-- GLOBAL MESSAGES -->
            <p:growl id="msgs" showDetail="true" life="4000" />

            <!-- ================= PROGRAM ENTRY ================= -->
            <p:panel header="📘 Program Management" style="margin-bottom:20px;">

                <p:panelGrid columns="4"
                             layout="grid"
                             styleClass="ui-fluid"
                             columnClasses="ui-grid-col-2,ui-grid-col-4,ui-grid-col-2,ui-grid-col-4">

                    <p:outputLabel for="code" value="Program Code" />
                    <p:inputText id="code"
                                 value="#{programBean.program.program_code}"
                                 required="true"
                                 placeholder="e.g. BSIT"
                                 requiredMessage="Program Code is required"/>

                    <p:outputLabel for="name" value="Program Name" />
                    <p:inputText id="name"
                                 value="#{programBean.program.program_name}"
                                 required="true"
                                 placeholder="Bachelor of Science in IT"
                                 requiredMessage="Program Name is required"/>

                </p:panelGrid>

                <div style="margin-top:15px;">
                    <p:commandButton value="💾 Save Program"
                                     icon="ui-icon-disk"
                                     action="#{programBean.saveProgram}"
                                     update="@form"
                                     styleClass="ui-button-success"/>
                </div>

            </p:panel>

            <!-- ================= PROGRAM LIST ================= -->
            <p:panel header="📋 Program List">

                <p:dataTable id="programTable"
                             value="#{programBean.programList}"
                             var="p"
                             paginator="true"
                             rows="10"
                             reflow="true"
                             emptyMessage="No programs found"
                             styleClass="ui-datatable-striped ui-datatable-hover">

                    <p:column headerText="Code" style="width:20%">
                        <h:outputText value="#{p.program_code}" />
                    </p:column>

                    <p:column headerText="Program Name">
                        <h:outputText value="#{p.program_name}" />
                    </p:column>

                    <p:column headerText="Actions" style="width:25%; text-align:center">

                        <p:commandButton icon="ui-icon-pencil"
                                         title="Edit"
                                         styleClass="ui-button-info"
                                         action="#{programBean.editProgram(p)}"
                                         update="@form"/>

                        <p:spacer width="6"/>

                        <p:commandButton icon="ui-icon-trash"
                                         title="Delete"
                                         styleClass="ui-button-danger"
                                         actionListener="#{programBean.confirmDelete(p)}"
                                         update=":confirmDeleteForm"
                                         oncomplete="PF('deleteDialog').show()"/>
                    </p:column>

                </p:dataTable>

            </p:panel>

        </h:form>

        <!-- ================= DELETE CONFIRM ================= -->
        <h:form id="confirmDeleteForm">

            <p:confirmDialog header="Confirm Delete"
                             widgetVar="deleteDialog"
                             closable="false"
                             width="350">

                <h:outputText value="Are you sure you want to delete this program?" />

                <f:facet name="footer">
                    <p:commandButton value="Yes"
                                     icon="ui-icon-check"
                                     action="#{programBean.deleteProgramConfirmed}"
                                     update=":programForm"
                                     styleClass="ui-button-danger"
                                     oncomplete="PF('deleteDialog').hide()" />

                    <p:commandButton value="No"
                                     type="button"
                                     icon="ui-icon-close"
                                     onclick="PF('deleteDialog').hide()" />
                </f:facet>

            </p:confirmDialog>

        </h:form>

    </ui:define>
</ui:composition>
