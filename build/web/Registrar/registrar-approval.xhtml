<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <body>

        <ui:composition template="/template/registrar-layout.xhtml">

            <ui:define name="content">

                <h:form id="approvalForm">

                    <p:panel header="Registrar – Enrollment Approval" style="margin-bottom:20px">

                        <p:messages id="msgs" showDetail="true" closable="true" />

                        <p:dataTable id="pendingTable"
                                     value="#{registrarBean.pendingEnrollments}"
                                     var="e"
                                     paginator="true" rows="10"
                                     emptyMessage="No pending enrollments found."
                                     styleClass="ui-striped">

                            <p:column headerText="Student No">
                                <h:outputText value="#{e.studno}" />
                            </p:column>

                            <p:column headerText="Name">
                                <h:outputText value="#{e.studentName}" />
                            </p:column>

                            <p:column headerText="Academic Year">
                                <h:outputText value="#{e.academic_year}" />
                            </p:column>

                            <p:column headerText="Semester">
                                <h:outputText value="#{e.semester}" />
                            </p:column>

                            <p:column headerText="Action" style="width:150px;text-align:center;">
                                <p:commandButton value="Approve"
                                                 icon="pi pi-check"
                                                 styleClass="ui-button-success"
                                                 action="#{registrarBean.approve(e)}"
                                                 update="approvalForm msgs" />
                            </p:column>

                        </p:dataTable>

                    </p:panel>

                </h:form>

            </ui:define>
        </ui:composition>

    </body>
</html>
