<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Registrar | Add-Drop Approval</title>
    </h:head>

    <h:body>

        <ui:composition template="/template/layout-registrar.xhtml">

            <ui:define name="content">

                <h:form id="approvalForm">

                    <p:panel header="Add / Drop Requests for Approval">

                        <p:dataTable value="#{registrarAddDropBean.pendingRequests}"
                                     var="r"
                                     rowKey="#{r.requestId}"
                                     paginator="true"
                                     rows="10"
                                     emptyMessage="No pending add-drop requests">

                            <p:column headerText="Student Name">
                                #{r.studentName}
                            </p:column>

                            <p:column headerText="Request Date">
                                <h:outputText value="#{r.requestDate}">
                                    <f:convertDateTime pattern="MMM dd, yyyy"/>
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Status">
                                <h:outputText value="#{r.status}"
                                              style="font-weight:bold;color:orange"/>
                            </p:column>

                            <p:column headerText="Action" style="width:120px;text-align:center">
                                <p:commandButton value="Review"
                                                 icon="ui-icon-search"
                                                 action="#{registrarAddDropBean.selectRequest(r)}"
                                                 update=":detailsForm"
                                                 oncomplete="PF('detailsDlg').show()"/>
                            </p:column>

                        </p:dataTable>

                    </p:panel>

                </h:form>

            </ui:define>

        </ui:composition>

        <!-- DETAILS DIALOG -->
        <ui:include src="registrar-add-drop-details.xhtml"/>

    </h:body>
</html>
