<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    template="/template/registrar-layout.xhtml">

    <ui:define name="content">

        <h:form id="courseForm" class="p-fluid">

            <!-- PAGE HEADER -->
            <h2 class="p-mb-3">📚 Course Management</h2>

            <p:messages id="msgs" closable="true" showDetail="true" />

            <!-- ================= SEARCH PANEL ================= -->
            <p:panel header="🔍 Search Courses"
                     style="max-width:720px; margin-bottom:20px">

                <div class="p-grid p-fluid p-mb-3">

                    <!-- Program -->
                    <div class="p-col-12 p-md-6 p-lg-4">

                        <p:panelGrid columns="1"
                                     layout="grid"
                                     styleClass="ui-fluid"
                                     style="border:0; padding:0">

                            <p:outputLabel for="programFilter" value="Program" />

                            <p:selectOneMenu id="programFilter"
                                             value="#{courseBean.selectedProgramId}">
                                <f:selectItem itemLabel="Select Program"
                                              itemValue="#{null}"
                                              noSelectionOption="true"/>
                                <f:selectItems value="#{courseBean.programList}"
                                               var="prog"
                                               itemValue="#{prog.program_id}"
                                               itemLabel="#{prog.program_name}"/>
                            </p:selectOneMenu>

                        </p:panelGrid>

                    </div>

                    <!-- Curriculum Year -->
                    <div class="p-col-12 p-md-6 p-lg-4">

                        <p:panelGrid columns="1"
                                     layout="grid"
                                     styleClass="ui-fluid"
                                     style="border:0; padding:0">

                            <p:outputLabel for="currYearFilter" value="Curriculum Year" />

                            <p:selectOneMenu id="currYearFilter"
                                             value="#{courseBean.selectedCurrYear}">
                                <f:selectItem itemLabel="All"
                                              itemValue="#{null}"
                                              noSelectionOption="true"/>
                                <f:selectItems value="#{courseBean.curriculumYearList}"
                                               var="cy"
                                               itemValue="#{cy}"
                                               itemLabel="#{cy}"/>
                            </p:selectOneMenu>

                        </p:panelGrid>

                    </div>

                </div>


                <p:commandButton value="🔎 Search"
                                 action="#{courseBean.searchCoursesByFilters}"
                                 update="courseTable courseForm:msgs"
                                 styleClass="ui-button-info"
                                 style="margin-top:12px" />

                <p:commandButton value="➕ Add Course"
                                 action="course"
                                 styleClass="ui-button-info"
                                 style="margin-top:12px" />

            </p:panel>

            <!-- ================= COURSE TABLE ================= -->
            <p:panel header="📄 Course List">

                <p:dataTable id="courseTable"
                             value="#{courseBean.filteredCourses}"
                             var="c"
                             paginator="true"
                             rows="10"
                             editable="true"
                             editMode="row"
                             rowKey="#{c.courseId}"
                             emptyMessage="No courses found">

                    <!-- Course Code -->
                    <p:column headerText="Code" style="width:120px">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{c.courseCode}" />
                            </f:facet>
                            <f:facet name="input">
                                <p:inputText value="#{c.courseCode}" />
                            </f:facet>
                        </p:cellEditor>
                    </p:column>

                    <!-- Title -->
                    <p:column headerText="Course Title">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{c.courseTitle}" />
                            </f:facet>
                            <f:facet name="input">
                                <p:inputText value="#{c.courseTitle}" />
                            </f:facet>
                        </p:cellEditor>
                    </p:column>

                    <!-- Units -->
                    <p:column headerText="Units" style="width:90px">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{c.units}" />
                            </f:facet>
                            <f:facet name="input">
                                <p:spinner value="#{c.units}" min="1" max="10" />
                            </f:facet>
                        </p:cellEditor>
                    </p:column>

                    <!-- Semester -->
                    <p:column headerText="Semester" style="width:120px">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{c.semester}" />
                            </f:facet>
                            <f:facet name="input">
                                <p:selectOneMenu value="#{c.semester}">
                                    <f:selectItem itemLabel="1st" itemValue="1st" />
                                    <f:selectItem itemLabel="2nd" itemValue="2nd" />
                                </p:selectOneMenu>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>

                    <!-- Year Level -->
                    <p:column headerText="Year Level" style="width:120px">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{c.yearLevel}" />
                            </f:facet>
                            <f:facet name="input">
                                <p:selectOneMenu value="#{c.yearLevel}">
                                    <f:selectItem itemLabel="1" itemValue="1" />
                                    <f:selectItem itemLabel="2" itemValue="2" />
                                    <f:selectItem itemLabel="3" itemValue="3" />
                                    <f:selectItem itemLabel="4" itemValue="4" />
                                </p:selectOneMenu>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>

                    <!-- Actions -->
                    <p:column headerText="Actions" style="width:120px; text-align:center">
                        <p:rowEditor />
                        <p:commandButton value="🗑"
                                         title="Delete"
                                         action="#{courseBean.deleteCourse(c.courseId)}"
                                         update="courseTable courseForm:msgs"
                                         styleClass="ui-button-danger p-ml-2"
                                         process="@this" />
                    </p:column>

                </p:dataTable>

            </p:panel>

        </h:form>

    </ui:define>
</ui:composition>
