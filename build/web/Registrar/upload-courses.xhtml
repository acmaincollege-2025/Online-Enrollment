<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template/registrar-layout.xhtml">

        <ui:define name="content">

            <h:form id="uploadForm" enctype="multipart/form-data" styleClass="ui-fluid">

                <div style="max-width:800px;margin:2rem auto;">

                    <p:panel header="📥 Upload Courses (Excel)" styleClass="shadow-panel">

                        <p:messages id="messages" showDetail="true" closable="true"/>

                        <!-- File Upload -->
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank">
                            <p:outputLabel value="Select Excel File (.xlsx)" />
                            <p:fileUpload
                                value="#{courseUploadBean.uploadedFile}"
                                mode="simple"
                                skinSimple="true"
                                allowTypes="/(\.|\/)(xlsx)$/"
                                required="true"
                                requiredMessage="Please select an Excel file."/>
                        </p:panelGrid>

                        <!-- Buttons -->
                        <div class="flex justify-content-between mt-4">

                            <p:commandButton
                                value="⬇️ Download Excel Template"
                                icon="pi pi-download"
                                ajax="false"
                                action="#{courseUploadBean.downloadTemplate}"
                                styleClass="ui-button-secondary"/>

                            <p:commandButton
                                value="🔎 Preview Courses"
                                icon="pi pi-eye"
                                action="#{courseUploadBean.parseExcel}"
                                update="previewTable messages"
                                oncomplete="if (!args.validationFailed) PF('previewDlg').show();"
                                styleClass="ui-button-info"/>

                        </div>

                    </p:panel>
                </div>

                <!-- PREVIEW DIALOG -->
                <p:dialog
                    header="📋 Preview Uploaded Courses"
                    widgetVar="previewDlg"
                    modal="true"
                    resizable="false"
                    width="900">

                    <p:dataTable
                        id="previewTable"
                        value="#{courseUploadBean.previewCourse}"
                        var="c"
                        paginator="true"
                        rows="10"
                        emptyMessage="No courses parsed">

                        <p:column headerText="Code">
                            <h:outputText value="#{c.code}"/>
                        </p:column>

                        <p:column headerText="Description">
                            <h:outputText value="#{c.description}"/>
                        </p:column>

                        <p:column headerText="Units">
                            <h:outputText value="#{c.units}"/>
                        </p:column>

                        <p:column headerText="Program">
                            <h:outputText value="#{c.programCode}"/>
                        </p:column>

                        <p:column headerText="Year">
                            <h:outputText value="#{c.yearLevel}"/>
                        </p:column>

                    </p:dataTable>

                    <f:facet name="footer">
                        <p:commandButton
                            value="Cancel"
                            icon="pi pi-times"
                            type="button"
                            onclick="PF('previewDlg').hide()"
                            styleClass="ui-button-secondary"/>

                        <p:commandButton
                            value="Upload &amp; Save Courses"
                            icon="pi pi-upload"
                            actionListener="#{courseUploadBean.saveCourses}"
                            update="messages"
                            styleClass="ui-button-success"/>
                    </f:facet>

                </p:dialog>

            </h:form>


        </ui:define>

    </ui:composition>

</html>
