<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition template="/template/layout-cashier.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="content">

        <h2>Pending Enrollment Payments</h2>

        <h:form id="form">

            <p:tabView>

                <!-- ONSITE -->

                <p:tab title="On-Site Payments">

                    <p:dataTable
                        value="#{cashierPaymentBean.onsitePayments}"
                        var="student"
                        selectionMode="single"
                        rowKey="#{student.assessmentId}"
                        selection="#{cashierPaymentBean.selectedStudent}">

                        <p:ajax event="rowSelect"
                                listener="#{cashierPaymentBean.onRowSelect}"
                                update="@form"/>

                        <p:column headerText="Student No">
                            #{student.studentNumber}
                        </p:column>

                        <p:column headerText="Student Name">
                            #{student.studentName}
                        </p:column>

                        <p:column headerText="Program">
                            #{student.programName}
                        </p:column>

                        <p:column headerText="Amount">
                            <h:outputText
                                value="#{student.totalAmount}">
                                <f:convertNumber type="currency"
                                                 currencySymbol="₱"
                                                 locale="en_PH"/>
                            </h:outputText>
                        </p:column>

                    </p:dataTable>

                </p:tab>

                <!-- ONLINE -->

                <p:tab title="Online Payments">

                    <p:dataTable
                        value="#{cashierPaymentBean.onlinePayments}"
                        var="student"
                        selectionMode="single"
                        rowKey="#{student.assessmentId}"
                        selection="#{cashierPaymentBean.selectedStudent}">

                        <p:column headerText="Student No">
                            #{student.studentNumber}
                        </p:column>

                        <p:column headerText="Student Name">
                            #{student.studentName}
                        </p:column>

                        <p:column headerText="Program">
                            #{student.programName}
                        </p:column>

                        <p:column headerText="Amount">
                            <h:outputText
                                value="#{student.totalAmount}">
                                <f:convertNumber
                                    type="currency"
                                    currencySymbol="₱"
                                    locale="en_PH"/>
                            </h:outputText>
                        </p:column>

                    </p:dataTable>

                </p:tab>

            </p:tabView>

            <p:separator/>

            

        </h:form>
    </ui:define>

</ui:composition>
