<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        
        <title>Cashier Panel</title>
        
        <!-- Font Awesome -->
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

        <style>
            body {
                margin: 0;
                font-family: "Segoe UI", Arial, sans-serif;
                background: #f4f6f9;
            }

            .layout-wrapper {
                display: flex;
                height: 100vh;
            }

            /* SIDEBAR */
            .sidebar {
                width: 240px;
                background: #1f2937;
                color: #fff;
                display: flex;
                flex-direction: column;
            }

            .sidebar-header {
                padding: 20px;
                font-size: 18px;
                font-weight: bold;
                text-align: center;
                background: #111827;
            }

            .sidebar a {
                color: #d1d5db;
                text-decoration: none;
                padding: 12px 20px;
                display: block;
            }

            .sidebar a:hover {
                background: #374151;
                color: #fff;
            }

            /* MAIN */
            .main {
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            .topbar {
                background: #ffffff;
                padding: 14px 20px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.1);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .content {
                padding: 24px;
                overflow-y: auto;
            }

            /* Optional Page Card */
            .page-card {
                background: #ffffff;
                padding: 20px;
                border-radius: 6px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            }
            .menu-item {
                color: #d1d5db;
                text-decoration: none;
                padding: 12px 20px;
                display: block;
                font-size: 14px;
            }

            .menu-item:hover {
                background: #374151;
                color: #fff;
            }
            .stat-grid {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                margin-top: 20px;
            }

            .stat-box {
                background: #ffffff;
                flex: 1;
                min-width: 220px;
                padding: 20px;
                border-radius: 8px;
                text-decoration: none;
                color: #111827;
                box-shadow: 0 2px 6px rgba(0,0,0,0.08);
                transition: all 0.2s ease;
                display: block;
            }

            .stat-box:hover {
                transform: translateY(-4px);
                box-shadow: 0 6px 14px rgba(0,0,0,0.12);
            }

            .stat-header {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 600;
                color: #374151;
            }

            .stat-icon {
                font-size: 22px;
            }

            .stat-value {
                font-size: 28px;
                font-weight: bold;
                margin-top: 12px;
            }

            .stat-desc {
                font-size: 13px;
                color: #6b7280;
                margin-top: 6px;
            }


        </style>

    </h:head>

    <h:body>
        <h:form>
            <p:idleMonitor timeout="900000"> <!-- 15 minutes -->
                <p:ajax event="idle" listener="#{loginBean.log_out}" />
            </p:idleMonitor>
        </h:form>
        <div class="layout-wrapper">

            <!-- SIDEBAR -->
            <ui:include src="/common/cashier-sidebar.xhtml" />

            <!-- MAIN -->
            <div class="main">

                <!-- TOPBAR   <div>
                        <p:commandButton value="Logout"
                                         icon="fa fa-sign-out-alt"
                                         styleClass="ui-button-danger ui-button-flat"
                                         action="{loginBean.logout}" />
                    </div>-->
                <div class="topbar">
                    <span><b>The Cashier</b></span>


                </div>

                <!-- CONTENT -->
                <div class="content">
                    <div class="page-card">
                        <ui:insert name="content" />
                    </div>
                </div>

            </div>

        </div>

    </h:body>
</html>
