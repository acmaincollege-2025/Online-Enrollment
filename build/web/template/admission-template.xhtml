<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <h:outputStylesheet
            name="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

        <title>Admission Portal</title>
        <h:outputStylesheet library="css" name="styles.css" />
        <style>
            .dashboard-card {
                background: #ffffff;
                border-radius: 8px;
                padding: 22px;
                text-align: center;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
                transition: all 0.25s ease;
            }

            .dashboard-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            }

            .card-icon {
                font-size: 42px;
                color: maroon;
                margin-bottom: 12px;
            }

            .dashboard-card h3 {
                margin: 8px 0 4px;
                font-size: 18px;
            }

            .dashboard-card p {
                margin: 0;
                font-size: 13px;
                color: #666;
            }

            /* Layout Wrapper */
            .layout-wrapper {
                display: flex;
                min-height: 100vh;
                background: #f4f4f4;
            }

            /* Sidebar */
            .sidebar {
                width: 260px;
                background: maroon;
                color: white;
                padding: 1.5rem;
                display: flex;
                flex-direction: column;
                box-shadow: 2px 0 6px rgba(0,0,0,0.15);
            }

            .sidebar h2 {
                margin: 0 0 1rem 0;
                font-size: 1.4rem;
                font-weight: bold;
                text-align: center;
            }

            /* Sidebar Menu Items */
            .sidebar-menu {
                margin-top: 1rem;
            }

            .sidebar-menu a {
                display: block;
                padding: .7rem 1rem;
                border-radius: 6px;
                color: white;
                font-weight: bold;
                margin-bottom: .5rem;
                background: rgba(255,255,255,0.1);
                text-decoration: none;
            }

            .sidebar-menu a:hover {
                background: rgba(0,0,0,0.2);
            }

            /* Profile Section */
            .profile-section {
                margin-top: auto;
                padding-top: 1.5rem;
                border-top: 1px solid rgba(255,255,255,0.3);
                text-align: center;
            }

            .profile-section strong {
                font-size: 1.1rem;
                display: block;
                margin-bottom: .5rem;
            }

            /* Header */
            .header {
                background: #ffffff;
                padding: 1rem 2rem;
                border-bottom: 1px solid #ddd;
                display: flex;
                justify-content: space-between;
                align-items: center;
                box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            }

            .header .user-info {
                font-weight: bold;
                color: maroon;
            }

            /* Content Area */
            .content-area {
                flex: 1;
                padding: 2rem;
            }

            /* Footer */
            .footer {
                text-align: center;
                background: #fff;
                padding: 10px;
                font-size: 0.9rem;
                color: #555;
                border-top: 1px solid #ddd;
            }
        </style>
    </h:head>

    <h:body>
        <h:form>
            <p:idleMonitor timeout="900000"> <!-- 15 minutes -->
                <p:ajax event="idle" listener="#{loginBean.logout}" />
            </p:idleMonitor>
        </h:form>
        <div class="layout-wrapper">

            <!-- SIDEBAR -->
            <div class="sidebar">

                <h2>Admission Panel</h2>

                <!-- Custom Page Sidebar Items -->
                <div class="sidebar-menu">
                    <ui:insert name="sidebar" />
                </div>

                <!-- Profile -->
                <div class="profile-section">
                    <strong>#{loginBean.user.fullname}</strong>
                    <p style="margin: 0;">#{loginBean.userRole}</p>

                    <p:commandLink value="Account Settings"
                                   onclick="PF('accountSettingsWidget').show();"
                                   style="color:white; font-size:0.9rem;" />

                    <br/><br/>

                    <p:commandLink value="Logout"
                                   action="#{loginBean.logout}"
                                   style="color:#ffdddd; font-weight:bold;" />
                </div>

            </div>

            <!-- MAIN CONTENT -->
            <div class="content-area">

                <!-- TOP HEADER -->
                <div class="header">
                    <span class="user-info">
                        Welcome, #{loginBean.user.username}
                    </span>
                    <span class="role">
                        Role: #{loginBean.userRole}
                    </span>
                </div>

                <!-- DYNAMIC PAGE CONTENT -->
                <ui:insert name="content" />

            </div>

        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2025 College Information System – Admission Portal
        </div>

        <!-- ACCOUNT SETTINGS DIALOG -->
        <p:dialog id="accountSettingsDialog"
                  widgetVar="accountSettingsWidget"
                  header="Account Settings"
                  modal="true"
                  closable="true"
                  width="500">

            <h:form id="accountForm">
                <p:panelGrid columns="2" columnClasses="label,value">

                    <p:outputLabel value="Username:" />
                    <p:inputText value="#{accountSettingsBean.username}" />

                    <p:outputLabel value="First Name:" />
                    <p:inputText value="#{accountSettingsBean.firstName}" />

                    <p:outputLabel value="Last Name:" />
                    <p:inputText value="#{accountSettingsBean.lastName}" />

                    <p:outputLabel value="Current Password:" />
                    <p:password value="#{accountSettingsBean.currentPassword}" />

                    <p:outputLabel value="New Password:" />
                    <p:password value="#{accountSettingsBean.newPassword}" />

                </p:panelGrid>

                <p:commandButton value="Update"
                                 action="#{accountSettingsBean.updateInfo}"
                                 update="@form"
                                 style="margin-top:1rem;" />
            </h:form>
        </p:dialog>

    </h:body>
</html>
