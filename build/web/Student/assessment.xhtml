<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template/student_layout.xhtml">

        <ui:define name="content">

            <h:form id="assessmentForm">

                <p:panel header="Assessment of Fees"
                         style="max-width:1100px;margin:auto;margin-top:2rem">

                    <p:messages showDetail="true" closable="true"/>

                    <!-- ================= STUDENT INFO ================= -->
                    <p:fieldset legend="Student Information">
                        <p:panelGrid columns="2" layout="grid"
                                     columnClasses="ui-g-12 ui-md-6"
                                     styleClass="ui-fluid">

                            <p:outputLabel value="Student Name"/>
                            <h:outputText value="#{assessBean.assessment.studentName}"
                                          style="font-weight:bold"/>

                            <p:outputLabel value="Program"/>
                            <h:outputText value="#{assessBean.assessment.programName}"/>

                            <p:outputLabel value="Status"/>
                            <h:outputText value="#{assessBean.assessment.status}"
                                          style="font-weight:bold;color:#2e7d32"/>
                        </p:panelGrid>
                    </p:fieldset>

                    <!-- ================= SUBJECTS ================= -->
                    <p:fieldset legend="Enrolled Subjects" style="margin-top:1rem">
                        <p:dataTable value="#{assessBean.subjectList}"
                                     var="s"
                                     styleClass="ui-striped"
                                     emptyMessage="No enrolled subjects found">

                            <p:column headerText="Course Code">
                                #{s.course.courseCode}
                            </p:column>

                            <p:column headerText="Description">
                                #{s.course.courseTitle}
                            </p:column>

                            <p:column headerText="Units" style="width:80px;text-align:center">
                                #{s.course.units}
                            </p:column>

                        </p:dataTable>
                    </p:fieldset>

                    <!-- ================= TUITION ================= -->
                    <p:fieldset legend="Tuition Details" style="margin-top:1rem">
                        <p:panelGrid columns="2" layout="grid"
                                     columnClasses="ui-g-12 ui-md-6"
                                     styleClass="ui-fluid">

                            <p:outputLabel value="Unit Fee"/>
                            <h:outputText value="#{assessBean.assessment.unitFee}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                            <p:outputLabel value="Total Units"/>
                            <h:outputText value="#{assessBean.assessment.totalUnits}"/>

                            <p:outputLabel value="Tuition Fee"/>
                            <h:outputText value="#{assessBean.tuitionTotal}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                        </p:panelGrid>
                    </p:fieldset>

                    <!-- ================= OTHER FEES ================= -->
                    <p:fieldset legend="Other Fees" style="margin-top:1rem">
                        <p:dataTable value="#{assessBean.assessment.otherFees}"
                                     var="f"
                                     emptyMessage="No additional fees applied">

                            <p:column headerText="Fee">
                                #{f.feeCode} - #{f.descriptions}
                            </p:column>

                            <p:column headerText="Amount" style="width:150px;text-align:right">
                                <h:outputText value="#{f.amount}">
                                    <f:convertNumber type="currency" currencySymbol="₱"/>
                                </h:outputText>
                            </p:column>

                        </p:dataTable>
                    </p:fieldset>

                    <!-- ================= SUMMARY ================= -->
                    <p:fieldset legend="Assessment Summary" style="margin-top:1rem">
                        <p:panelGrid columns="2" layout="grid"
                                     columnClasses="ui-g-12 ui-md-6"
                                     styleClass="ui-fluid">

                            <p:outputLabel value="Basic Fees Total"/>
                            <h:outputText value="#{assessBean.basicFeeTotal}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                            <p:outputLabel value="Other Fees Total"/>
                            <h:outputText value="#{assessBean.otherFeeTotal}">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                            <p:outputLabel value="Grand Total"
                                           style="font-weight:bold"/>
                            <h:outputText value="#{assessBean.calculatedTotal}"
                                          style="font-size:1.3em;font-weight:bold;color:#2e7d32">
                                <f:convertNumber type="currency" currencySymbol="₱"/>
                            </h:outputText>

                        </p:panelGrid>
                    </p:fieldset>

                    <!-- ================= ACTION ================= -->
                    <div style="text-align:right;margin-top:1.5rem">

                        <p:commandButton value="Proceed to Payment"
                                         icon="pi pi-arrow-right"
                                         action="#{assessBean.proceedToPayment}"
                                         disabled="#{assessBean.assessmentLocked}"
                                         styleClass="ui-button-success">
                            <p:confirm message="Confirm assessment and proceed to payment?" />
                        </p:commandButton>

                    </div>

                </p:panel>

                <!-- Confirmation Dialog -->
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Yes"
                                     type="button"
                                     styleClass="ui-confirmdialog-yes ui-button-success"/>
                    <p:commandButton value="No"
                                     type="button"
                                     styleClass="ui-confirmdialog-no ui-button-secondary"/>
                </p:confirmDialog>

            </h:form>

        </ui:define>

    </ui:composition>
</html>
