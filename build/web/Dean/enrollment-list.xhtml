<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/template/layout-dean.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- ===================== SIDEBAR ===================== -->
    <ui:define name="sidebar">
        <h:form>
            <div class="p-d-flex p-flex-column">
                <p:link outcome="dean" value="📊 Dashboard" styleClass="sidebar-link" />
                <p:link outcome="index" value="🚪 Logout" styleClass="sidebar-link" />
            </div>
        </h:form>
    </ui:define>

    <!-- ===================== MAIN CONTENT ===================== -->
    <ui:define name="content">

        <h:form id="form">

            <p:panel header="Enrollment List">

                <p:panelGrid columns="8">

                    <p:outputLabel value="Program"/>

                    <p:selectOneMenu value="#{enrollmentListBean.programId}">
                        <f:selectItem itemLabel="All Programs" itemValue="0"/>
                        <f:selectItems value="#{enrollmentListBean.programs}"
                                       var="p"
                                       itemLabel="#{p.program_name}"
                                       itemValue="#{p.program_id}"/>
                    </p:selectOneMenu>

                    <p:outputLabel value="Year Level"/>

                    <p:selectOneMenu value="#{enrollmentListBean.yearLevel}">
                        <f:selectItem itemLabel="All" itemValue=""/>
                        <f:selectItem itemLabel="1st Year" itemValue="1"/>
                        <f:selectItem itemLabel="2nd Year" itemValue="2"/>
                        <f:selectItem itemLabel="3rd Year" itemValue="3"/>
                        <f:selectItem itemLabel="4th Year" itemValue="4"/>
                    </p:selectOneMenu>

                    <p:outputLabel value="Semester"/>

                    <p:selectOneMenu value="#{enrollmentListBean.semester}">
                        <f:selectItem itemLabel="All" itemValue=""/>
                        <f:selectItem itemLabel="1st Semester" itemValue="1st"/>
                        <f:selectItem itemLabel="2nd Semester" itemValue="2nd"/>
                    </p:selectOneMenu>

                    <p:commandButton value="🔍 Search"
                                     actionListener="#{enrollmentListBean.loadEnrollmentList}"
                                     update="tblEnrollment"/>

                </p:panelGrid>

            </p:panel>
            <!--Export Button -->
            <p:commandButton value="🧾 Excel"
                             ajax="false">

                <p:dataExporter type="xlsx"
                                target="tblEnrollment"
                                fileName="Enrollment_List"/>
            </p:commandButton>

            <p:commandButton value="📃 PDF"
                             ajax="false">

                <p:dataExporter type="pdf"
                                target="tblEnrollment"
                                fileName="Enrollment_List"/>
            </p:commandButton>
            <!--Print -->
            <p:commandButton value="🖨 Print"
                             type="button"
                             onclick="window.print()"/>
            
            <p:dataTable id="tblEnrollment"
                         value="#{enrollmentListBean.enrollmentList}"
                         var="e"
                         paginator="true"
                         rows="20">

                <p:column headerText="Student No">
                    <h:outputText value="#{e.studno}"/>
                </p:column>

                <p:column headerText="Student Name">
                    <h:outputText value="#{e.studentName}"/>
                </p:column>

                <p:column headerText="Program">
                    <h:outputText value="#{e.programName}"/>
                </p:column>

                <p:column headerText="Year">
                    <h:outputText value="#{e.yearLevel}"/>
                </p:column>

                <p:column headerText="Semester">
                    <h:outputText value="#{e.semester}"/>
                </p:column>

                <p:column headerText="Status">
                    <h:outputText value="#{e.status}"/>
                </p:column>

            </p:dataTable>

        </h:form>

    </ui:define>
</ui:composition>
