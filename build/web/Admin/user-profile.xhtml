<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition template="/template/admin-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="content">

        <h:form id="profileForm">

            <p:messages id="msgs" showDetail="true" closable="true" />

            <!-- ================= PROFILE INFO PANEL ================= -->
            <p:panel header="👤 User Profile" styleClass="mb-3">

                <p:fieldset legend="Update Profile Information">
                    <h:panelGrid columns="2"
                                 columnClasses="label,value"
                                 cellpadding="8"
                                 style="width:100%;">

                        <h:outputLabel for="username" value="Username" />
                        <p:inputText id="username"
                                     value="#{userProfileBean.currentUser.username}"
                                     required="true"
                                     style="width:100%;" />

                        <h:outputLabel for="firstname" value="First Name" />
                        <p:inputText id="firstname"
                                     value="#{userProfileBean.currentUser.firstname}"
                                     style="width:100%;" />

                        <h:outputLabel for="lastname" value="Last Name" />
                        <p:inputText id="lastname"
                                     value="#{userProfileBean.currentUser.lastname}"
                                     style="width:100%;" />

                    </h:panelGrid>

                    <p:separator />

                    <p:commandButton value="Update Profile"
                                     icon="pi pi-save"
                                     action="#{userProfileBean.updateProfile}"
                                     update="profileForm"
                                     styleClass="p-button-success" />
                </p:fieldset>

            </p:panel>

            <!-- ================= PASSWORD PANEL ================= -->
            <p:panel header="🔒 Change Password">

                <p:fieldset legend="Security">
                    <h:panelGrid columns="2"
                                 columnClasses="label,value"
                                 cellpadding="8"
                                 style="width:100%;">

                        <h:outputLabel for="currentPwd" value="Current Password" />
                        <p:password id="currentPwd"
                                    value="#{userProfileBean.currentPassword}"
                                    feedback="false"
                                    required="true"
                                    style="width:100%;" />

                        <h:outputLabel for="newPwd" value="New Password" />
                        <p:password id="newPwd"
                                    value="#{userProfileBean.newPassword}"
                                    feedback="false"
                                    required="true"
                                    style="width:100%;" />

                        <h:outputLabel for="confirmPwd" value="Confirm Password" />
                        <p:password id="confirmPwd"
                                    value="#{userProfileBean.confirmPassword}"
                                    feedback="false"
                                    required="true"
                                    style="width:100%;" />

                    </h:panelGrid>

                    <p:separator />

                    <p:commandButton value="Change Password"
                                     icon="pi pi-lock"
                                     action="#{userProfileBean.changePassword}"
                                     update="profileForm"
                                     styleClass="p-button-warning" />
                </p:fieldset>

            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>
