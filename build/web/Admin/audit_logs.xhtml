<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/template/admin-layout.xhtml">

    <ui:define name="content">

        <!-- PAGE HEADER -->
        <div class="page-header">
            <h1>📜 Audit Logs</h1>
            <p>System activity records for monitoring and security.</p>
        </div>

        <!-- CARD -->
        <div class="card">

            <h:form id="auditForm">

                <p:dataTable
                        value="#{auditLogBean.logs}"
                        var="log"
                        paginator="true"
                        rows="10"
                        emptyMessage="No audit logs found."
                        styleClass="ui-datatable-striped">

                    <p:column headerText="ID" width="60">
                        <h:outputText value="#{log.id}" />
                    </p:column>

                    <p:column headerText="User">
                        <h:outputText value="#{log.username}" />
                    </p:column>

                    <p:column headerText="Action">
                        <h:outputText value="#{log.action}" />
                    </p:column>

                    <p:column headerText="Description">
                        <h:outputText value="#{log.userType}" />
                    </p:column>

                    <p:column headerText="Date">
                        <h:outputText value="#{log.timestamp}">
                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm" />
                        </h:outputText>
                    </p:column>

                </p:dataTable>

            </h:form>

        </div>

    </ui:define>

</ui:composition>
</html>
