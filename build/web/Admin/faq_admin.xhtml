<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition template="/template/admin-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="content">

        <h2>❓ FAQ Manager</h2>
        <p>Manage Frequently Asked Questions shown to users.</p>

        <!-- ================= ADD FAQ ================= -->
        <p:panel header="➕ Add New FAQ" styleClass="ui-panel ui-widget-content">

            <h:form id="faqForm">
                <p:messages id="msg" closable="true"/>

                <p:panelGrid columns="2" style="width:100%;" columnClasses="label,value">
                    <h:outputLabel for="question" value="Question:"/>
                    <p:inputText id="question"
                                 value="#{faqBean.question}"
                                 required="true"
                                 style="width:100%;" />

                    <h:outputLabel for="answer" value="Answer:"/>
                    <p:inputTextarea id="answer"
                                     value="#{faqBean.answer}"
                                     rows="4"
                                     required="true"
                                     style="width:100%;" />
                </p:panelGrid>

                <br/>

                <p:commandButton value="💾 Save FAQ"
                                 styleClass="p-button-success"
                                 update="faqTable msg"
                                 actionListener="#{faqBean.saveFAQ}" />
            </h:form>
        </p:panel>

        <br/>

        <!-- ================= FAQ LIST ================= -->
        <p:panel header="📋 FAQ List">

            <h:form id="faqTable">
                <p:dataTable value="#{faqBean.faqList}"
                              var="f"
                              paginator="true"
                              rows="5"
                              styleClass="ui-datatable-striped ui-datatable-sm"
                              style="width:100%;">

                    <p:column headerText="Question">
                        <h:outputText value="#{f.question}"/>
                    </p:column>

                    <p:column headerText="Answer">
                        <h:outputText value="#{f.answer}"/>
                    </p:column>

                    <p:column headerText="Actions" style="width:150px; text-align:center;">
                        <p:commandButton icon="pi pi-pencil"
                                         title="Edit"
                                         styleClass="p-button-text"
                                         process="@this"
                                         update=":editDialogForm"
                                         oncomplete="PF('faqEditDialog').show();"
                                         actionListener="#{faqBean.loadFAQ(f)}"/>

                        <p:commandButton icon="pi pi-trash"
                                         title="Delete"
                                         styleClass="p-button-text p-button-danger"
                                         update="@form"
                                         actionListener="#{faqBean.deleteFAQ(f)}"/>
                    </p:column>

                </p:dataTable>

            </h:form>
        </p:panel>

        <!-- ================= EDIT FAQ DIALOG ================= -->
        <p:dialog widgetVar="faqEditDialog"
                  header="✏ Edit FAQ"
                  modal="true"
                  width="500"
                  closable="true"
                  resizable="false">

            <h:form id="editDialogForm">

                <p:panelGrid columns="2" style="width:100%;">
                    <h:outputLabel value="Question:"/>
                    <p:inputText value="#{faqBean.question}"
                                 required="true"
                                 style="width:100%;" />

                    <h:outputLabel value="Answer:"/>
                    <p:inputTextarea value="#{faqBean.answer}"
                                     rows="4"
                                     required="true"
                                     style="width:100%;" />
                </p:panelGrid>

                <br/>

                <p:commandButton value="💾 Update FAQ"
                                 styleClass="p-button-success"
                                 update=":faqTable"
                                 oncomplete="PF('faqEditDialog').hide();"
                                 actionListener="#{faqBean.updateFAQ}" />
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
