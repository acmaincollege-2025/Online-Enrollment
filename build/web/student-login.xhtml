<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Student Login</title>

        <style>
            body {
                background: #f4f6f9;
                font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
            }

            .login-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .login-card {
                width: 400px;
                background: #ffffff;
                padding: 2.5rem;
                border-radius: 10px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            }

            .login-header {
                text-align: center;
                margin-bottom: 1.5rem;
            }

            .login-header img {
                width: 90px;
                margin-bottom: 0.5rem;
            }

            .login-header h2 {
                margin: 0;
                font-weight: 600;
                color: #2c3e50;
            }

            .login-header span {
                font-size: 0.9rem;
                color: #6c757d;
            }

            .login-field {
                margin-bottom: 1rem;
            }

            .login-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.85rem;
                margin-top: 0.5rem;
            }

            .login-footer a {
                color: #6a1b9a;
                text-decoration: none;
            }

            .login-footer a:hover {
                text-decoration: underline;
            }

            .login-button {
                margin-top: 1.5rem;
                width: 100%;
                background-color: #6a1b9a !important;
                border-color: #6a1b9a !important;
            }

            .login-button:hover {
                background-color: #7b1fa2 !important;
            }

            .academic-footer {
                margin-top: 2rem;
                text-align: center;
                font-size: 0.75rem;
                color: #999;
            }
            .home-button {
                position: absolute;
                top: 20px;
                left: 20px;
                font-size: 1.4rem;
                text-decoration: none;
                color: #6a1b9a;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .home-button:hover {
                color: #7b1fa2;
            }

        </style>
    </h:head>

    <h:body style="position:relative;">

        <!-- HOME BUTTON -->
        <h:link outcome="/index.xhtml" styleClass="home-button">
            🏠 Home
        </h:link>


        <div class="login-container">

            <h:form id="studentLoginForm">

                <div class="login-card">

                    <!-- HEADER -->
                    <div class="login-header">
                        <h:graphicImage library="logo"
                                        name="logo.png" />
                        <h2>Student Portal</h2>
                        <span>Online Enrollment System</span>
                    </div>

                    <p:messages showDetail="false" closable="true" />

                    <!-- STUDENT NUMBER -->
                    <div class="login-field">
                        <p:inputText value="#{studentLoginBean.username}"
                                     placeholder="Student Number"
                                     required="true"
                                     style="width:100%" />
                    </div>

                    <!-- PASSWORD -->
                    <div class="login-field">
                        <p:password value="#{studentLoginBean.password}"
                                    placeholder="Password"
                                    required="true"
                                    style="width:100%" />
                    </div>

                    <!-- REMEMBER + DPA -->
                    <div class="login-footer">
                        <span>
                            <p:selectBooleanCheckbox value="#{studentLoginBean.rememberMe}" />
                            Remember me
                        </span>

                        <ui:include src="/includes/dpa-dialog.xhtml" />

                        <!-- DATA PRIVACY LINK -->
                        <h:outputLink value="#" onclick="PF('dpaDialog').show(); return false;">
                            Data Privacy Agreement
                        </h:outputLink>

                    </div>

                    <!-- LOGIN -->
                    <p:commandButton value="Sign In"
                                     action="#{studentLoginBean.login}"
                                     update="@form"
                                     styleClass="login-button"
                                     icon="pi pi-sign-in" />

                    <!-- ACADEMIC FOOTER -->
                    <div class="academic-footer">
                        © #{java.time.Year.now().value} Alitagtag College Inc.
                    </div>

                </div>

            </h:form>

        </div>

    </h:body>
</html>
